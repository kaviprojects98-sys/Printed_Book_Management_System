<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="css/staff.css">
</head>

<body>

<div class="dashboard">

    <h1>Samanala Bookshop</h1>
    <h2>Book Store Management System</h2>

    <div class="staff-name">
        Staff Login: <span id="staffName"></span>
    </div>

    <!-- Main Menu -->
    <div id="mainMenu">
        <button onclick="showPublishers()">
            Create a New Stock Sheet
        </button>

        <button onclick="updateStockSheet()">
            Preview / Update Last Stock Sheet
        </button>

        <button onclick="previewStockSheets()">
            Preview Last 3 Stock Sheets
        </button>

        <button class="logout" onclick="logout()">
            Logout
        </button>
    </div>

    <!-- Publisher Menu -->
    <div id="publisherMenu" style="display: none;">
        <button onclick="openAkura()">
            Akura
        </button>

        <button onclick="showWijethungaSubMenu()">
            Wijethunga
        </button>

        <button onclick="openMasterguide()">
            Masterguide
        </button>

        <button class="back" onclick="goBackToMainMenu()">
            ← Back
        </button>
    </div>

    <!-- Wijethunga Sub-Menu -->
    <div id="wijethungaMenu" style="display: none;">
        <button onclick="openWijethunga('6_11')">
            Grade 6-11 orders
        </button>

        <button onclick="openWijethunga('ol')">
            OL orders
        </button>

        <button class="back" onclick="goBackToPublisherMenu()">
            ← Back
        </button>
    </div>

</div>

<script>
// Display logged in staff/shop name
const user = JSON.parse(sessionStorage.getItem("user"));
if (user && user.shopName) {
    document.getElementById("staffName").innerText = user.shopName;
}

function showPublishers() {
    document.getElementById("mainMenu").style.display = "none";
    document.getElementById("publisherMenu").style.display = "block";
}

function goBackToMainMenu() {
    document.getElementById("publisherMenu").style.display = "none";
    document.getElementById("mainMenu").style.display = "block";
}

function showWijethungaSubMenu() {
    document.getElementById("publisherMenu").style.display = "none";
    document.getElementById("wijethungaMenu").style.display = "block";
}

function goBackToPublisherMenu() {
    document.getElementById("wijethungaMenu").style.display = "none";
    document.getElementById("publisherMenu").style.display = "block";
}

function openAkura() {
    window.location.href = "forms/akura_shortnote_form.html";
}

function openWijethunga(type) {
    const user = JSON.parse(sessionStorage.getItem("user"));
    const baseUrl = "https://script.google.com/macros/s/AKfycbwLaYh9m5Lc2MwFThleWbhwwMVUtL9R2DGr06U7bNPJumV2pBFLAI0aW-Hc__LsqZ5X/exec";
    
    const shopMap = {
        "M Shop": "m_shop",
        "V Shop": "v_shop",
        "A Shop": "a_shop",
        "H Shop": "h_shop"
    };

    if (user && user.shopName) {
        const shopParam = shopMap[user.shopName] || "m_shop";
        // Append both shop parameter and form type parameter (type=6_11 or type=ol)
        window.location.href = `${baseUrl}?shop=${shopParam}&type=${type}`;
    } else {
        alert("User session not found. Please log in again.");
        window.location.href = "index.html";
    }
}

function openMasterguide() {
    alert("Open Masterguide Form");
}

function updateStockSheet() {
    alert("Preview / Update Last Stock Sheet");
}

function previewStockSheets() {
    alert("Preview Last 3 Stock Sheets");
}

function logout() {
    sessionStorage.removeItem("user");
    window.location.href = "index.html";
}
</script>

</body>

</html>
