<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="login-box">

        <h1>Shop Login</h1>

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="off">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script type="module" src="js/script.js"></script>

</body>
</html>
